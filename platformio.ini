; Окружения, которые собирает `platformio run` без аргументов.
;
; native в список не входит намеренно: это окружение существует только ради
; `platformio test -e native`, отдельной прошивки из него не получается (в src нет
; main()), а собирать его на машине без хостового gcc просто нечем
[platformio]
default_envs = esp32, esp32-mock, esp32s3-wt32, esp32s3-wt32-mock

; Общие параметры прошивок ESP32.
;
; Намеренно лежат в [esp32_common], а не в [env]: секция [env] применяется ко
; ВСЕМ окружениям, включая native. Тому не нужны ни платформа ESP32, ни Arduino,
; ни TFT_eSPI, ни флаги дисплея — с ними сборка тестов под хост просто не пойдет
[esp32_common]
platform = espressif32@6.7.0
framework = arduino
monitor_speed = 115200
build_type = release
build_unflags = -Os
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -O3
    -D CONFIG_DISABLE_HAL_LOCKS=1
    -D USER_SETUP_LOADED=1
    -D DISABLE_TOUCH=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1

; Прошивка с реальными данными из CAN-шины (ESP32 DEVKIT1, ST7789 240×240)
[env:esp32]
extends = esp32_common
board = esp32doit-devkit-v1
board_build.partitions = partitions_4mb.csv
upload_protocol = esptool
upload_speed = 921600
build_src_filter =
    +<*>
    -<DisplayManagerWT32.cpp>
build_flags =
    ${esp32_common.build_flags}
    ; SPI-дисплей ST7789 — touch отключён (пин -1), но объявления TFT_eSPI подключаются корректно
    -D TOUCH_CS=-1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_RST=4
    -D TFT_DC=15
    -D TFT_CS=-1
    -D SPI_FREQUENCY=40000000
    -D CAN_TX_PIN_NUM=32
    -D CAN_RX_PIN_NUM=34
    -D BUZZER_PIN_NUM=26

; Прошивка с имитацией значений (ESP32 DEVKIT1, ST7789 240×240)
[env:esp32-mock]
extends = esp32_common
board = esp32doit-devkit-v1
board_build.partitions = partitions_4mb.csv
upload_protocol = esptool
upload_speed = 921600
build_src_filter =
    +<*>
    -<DisplayManagerWT32.cpp>
build_flags =
    ${esp32_common.build_flags}
    ; SPI-дисплей ST7789 — touch отключён (пин -1), но объявления TFT_eSPI подключаются корректно
    -D TOUCH_CS=-1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_RST=4
    -D TFT_DC=15
    -D TFT_CS=-1
    -D SPI_FREQUENCY=40000000
    -D CAN_TX_PIN_NUM=32
    -D CAN_RX_PIN_NUM=34
    -D BUZZER_PIN_NUM=26
    -D USE_MOCK_DATA

; Пассивный перехват диагностического UDS-трафика (ESP32 DEVKIT1, ST7789 240×240)
; Сборка не входит в default_envs и не передает кадры в CAN-шину
[env:esp32-hook]
extends = env:esp32
monitor_speed = 921600
build_flags =
    ${env:esp32.build_flags}
    -D DID_HOOK_MODE=1
    -D DID_HOOK_SERIAL_BAUD=921600

; Прошивка с реальными данными из CAN-шины (WT32-SC01 Plus ESP32-S3, ST7796 320×480)
; Прошивается через встроенный USB Serial/JTAG (без CP210x/CH340 на плате)
[env:esp32s3-wt32]
extends = esp32_common
board = wt32-sc01-plus
board_build.partitions = partitions_16mb.csv
upload_protocol = esptool
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    lovyan03/LovyanGFX @ ^1.2.25
build_src_filter =
    +<*>
    -<DisplayManager.cpp>
build_flags =
    ${esp32_common.build_flags}
    -O2
    -D DISPLAY_WT32_S3=1
    -D ESP32_S3=1
    -D ST7796_DRIVER=1
    -D TFT_PARALLEL_8_BIT=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_DC=0
    -D TFT_CS=-1
    -D TFT_RST=4
    -D TFT_WR=47
    -D TFT_RD=-1
    -D TFT_D0=9
    -D TFT_D1=46
    -D TFT_D2=3
    -D TFT_D3=8
    -D TFT_D4=18
    -D TFT_D5=17
    -D TFT_D6=16
    -D TFT_D7=15
    ; Свободные выводы разъёма EXT_IO на WT32-SC01 Plus
    -D CAN_TX_PIN_NUM=10
    -D CAN_RX_PIN_NUM=11
    -D BUZZER_PIN_NUM=12

; Прошивка с имитацией значений (WT32-SC01 Plus ESP32-S3, ST7796 320×480)
[env:esp32s3-wt32-mock]
extends = esp32_common
board = wt32-sc01-plus
board_build.partitions = partitions_16mb.csv
upload_protocol = esptool
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    lovyan03/LovyanGFX @ ^1.2.25
build_src_filter =
    +<*>
    -<DisplayManager.cpp>
build_flags =
    ${esp32_common.build_flags}
    -O2
    -D DISPLAY_WT32_S3=1
    -D ESP32_S3=1
    -D ST7796_DRIVER=1
    -D TFT_PARALLEL_8_BIT=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_DC=0
    -D TFT_CS=-1
    -D TFT_RST=4
    -D TFT_WR=47
    -D TFT_RD=-1
    -D TFT_D0=9
    -D TFT_D1=46
    -D TFT_D2=3
    -D TFT_D3=8
    -D TFT_D4=18
    -D TFT_D5=17
    -D TFT_D6=16
    -D TFT_D7=15
    ; Свободные выводы разъёма EXT_IO на WT32-SC01 Plus
    -D CAN_TX_PIN_NUM=10
    -D CAN_RX_PIN_NUM=11
    -D BUZZER_PIN_NUM=12
    -D USE_MOCK_DATA

; Юнит-тесты под хостом: обычный gcc/clang, без ESP32 и без подключенной платы.
; Прогон: platformio test -e native
;
; Собираются только модули прошивки, не зависящие от железа. Всё, что тянет
; TWAI, TFT_eSPI или WebServer, исключено через build_src_filter, а Arduino.h
; и LittleFS.h подменяются заглушками из test/stubs
[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_ignore = stubs
build_type = debug
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
build_src_filter =
    -<*>
    +<CanDecoder.cpp>
    +<CanRecovery.cpp>
    +<ObdPidCatalog.cpp>
    +<ConfigManager.cpp>
    +<AlertManager.cpp>
    +<FsUtils.cpp>
    +<MetricColors.cpp>
    +<OtaImage.cpp>
build_flags =
    -std=gnu++17
    -Wall
    -I test/stubs
    -D UNIT_TEST=1
    ; BuzzerController.h раскрывает этот макрос на уровне пространства имен
    -D BUZZER_PIN_NUM=26
    ; ArduinoJson читает и пишет файлы через Stream/Print — заглушка File
    ; наследуется от них, поэтому адаптеры надо включить явно
    -D ARDUINOJSON_ENABLE_ARDUINO_STREAM=1
    -D ARDUINOJSON_ENABLE_ARDUINO_PRINT=1
