# Путь в репозитории: .github/workflows/build.yml
#
# Что делает:
#   * прогоняет юнит-тесты под хостом — это первый и самый быстрый барьер;
#   * только если тесты прошли, собирает все четыре окружения параллельно;
#   * при push тега вида v2026.3.2 — сверяет версию в include/Version.h с тегом,
#     кладёт бинарники ESP32 DEVKIT1 в черновик релиза на этот тег и публикует
#     firmware.bin в ветку firmware, откуда его качает веб-интерфейс устройства.
#
# Тесты идут первыми намеренно: собирать прошивку, зная что логика уже сломана,
# смысла нет. Сами сборки друг друга не ждут и не отменяют — любая упавшая
# красит весь прогон в красный, а release не запускается.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Группа включает ref, поэтому у каждой ветки и каждого тега своя очередь.
# Новый push в main отменяет предыдущую сборку той же ветки — устаревший
# результат всё равно никому не нужен
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify firmware version matches tag
        # Версия зашита в include/Version.h руками, тег ставится отдельно.
        # Без этой проверки релиз v2026.3.2 мог бы уехать с прошивкой,
        # которая показывает на дисплее 2026.3.1.
        # Проверка стоит здесь, а не в сборке: она мгновенная и незачем
        # гонять четыре тулчейна ради заведомо испорченного релиза
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC=$(grep -oP '^#define\s+FW_VERSION\s+"\K[^"]+' include/Version.h)
          echo "тег: $TAG, прошивка: $SRC"
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::Версия в include/Version.h ($SRC) не совпадает с тегом ($TAG)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        # Окружению native тулчейн не нужен — на runner уже есть gcc.
        # Кэшируется только ядро PlatformIO и Unity с ArduinoJson
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-native-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-native-

      - name: Install PlatformIO
        # версия зафиксирована, чтобы CI собирал тем же, чем собирают локально
        run: pip install "platformio==6.1.19"

      - name: Run tests
        run: pio test -e native

  build:
    name: ${{ matrix.env }}
    # Ни одна прошивка не собирается, пока тесты не прошли
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # Не отменять остальные окружения, если одно упало — хочется увидеть
      # сразу все поломки за один прогон, а не чинить их по очереди.
      # Общий статус прогона всё равно станет failed, а release не запустится:
      # он висит на needs: build
      fail-fast: false
      matrix:
        # chip нужен только для ключа кэша: ESP32 и ESP32-S3 тянут разные
        # тулчейны (xtensa-esp32-elf и xtensa-esp32s3-elf), общий кэш на все
        # четыре окружения давал попадание только одному из них
        include:
          - env: esp32
            chip: esp32
          - env: esp32-mock
            chip: esp32
          - env: esp32s3-wt32
            chip: esp32s3
          - env: esp32s3-wt32-mock
            chip: esp32s3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache PlatformIO toolchains
        # без кэша каждая сборка качает ~500 МБ тулчейна xtensa (2-4 минуты),
        # с кэшем — секунды. Ключ завязан на чип и на platformio.ini, поэтому
        # при смене версии платформы кэш автоматически пересобирается
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ matrix.chip }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.chip }}-

      - name: Install PlatformIO
        # версия зафиксирована, чтобы CI собирал тем же, чем собирают локально
        run: pip install "platformio==6.1.19"

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Check firmware fits the OTA slot
        # Размер слота берём прямо из partitions.csv, чтобы проверка не
        # разошлась с таблицей разделов, если её когда-нибудь поправят.
        # Если firmware.bin перерастёт слот, OTA-обновление сломается уже
        # у пользователя, а не на сборке. Пусть падает здесь
        run: |
          RAW=$(awk -F',' '$1 ~ /^ota_0/ { gsub(/[ \t]/,"",$5); print $5 }' partitions.csv)
          if [ -z "$RAW" ]; then
            echo "::error::Не удалось прочитать размер ota_0 из partitions.csv"
            exit 1
          fi
          SLOT=$((RAW))
          SIZE=$(stat -c%s ".pio/build/${{ matrix.env }}/firmware.bin")
          PCT=$(( SIZE * 100 / SLOT ))
          echo "firmware.bin: $SIZE байт из $SLOT ($PCT% слота OTA)"
          echo "### ${{ matrix.env }}: $SIZE байт ($PCT% слота OTA)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$SLOT" ]; then
            echo "::error::Прошивка не влезает в OTA-слот"
            exit 1
          fi
          if [ "$PCT" -gt 90 ]; then
            echo "::warning::Занято больше 90% слота OTA"
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    # ждём все четыре окружения: релиз не должен уезжать, если хоть одна
    # сборка сломана
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download ESP32 DEVKIT1 binaries
        uses: actions/download-artifact@v7
        with:
          name: esp32
          path: release/

      # Когда появятся бинарники для WT32-SC01 Plus — раскомментировать блок
      # ниже и добавить три файла из esp32s3/ в список files. Имена файлов
      # у обеих плат одинаковые, поэтому раскладывать их надо по разным папкам.
      # Учесть: у ESP32-S3 bootloader.bin шьётся по адресу 0x0, а не 0x1000,
      # как у ESP32 — таблицу адресов в README (раздел 3.3) надо будет дополнить.
      #
      # - name: Download WT32-SC01 Plus binaries
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: esp32s3-wt32
      #     path: esp32s3/

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/bootloader.bin
            release/partitions.bin
            release/firmware.bin

  publish-firmware:
    name: Publish firmware for the web updater
    # ветка обновляется только после успешной сборки всех окружений
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download ESP32 DEVKIT1 binaries
        uses: actions/download-artifact@v7
        with:
          name: esp32
          path: bin/

      - name: Push firmware to the firmware branch
        # Зачем отдельная ветка: кнопка «Скачать и установить» в веб-интерфейсе
        # тянет .bin запросом из браузера телефона, а ассеты релизов GitHub
        # отдаёт с хоста release-assets.githubusercontent.com без заголовка
        # Access-Control-Allow-Origin — браузер такой ответ до JS не допускает.
        # raw.githubusercontent.com отдаёт файлы репозитория с CORS, поэтому
        # прошивка публикуется ещё и туда.
        #
        # Ветка сиротская (без истории кода) и пересоздаётся на каждом релизе:
        # хранится ровно одна прошивка в папке с номером версии. Версия в пути
        # означает, что устройству не может приехать .bin от другого релиза,
        # а force-push не даёт репозиторию распухать от старых бинарников
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WORK=$(mktemp -d)

          mkdir -p "$WORK/$VERSION"
          cp bin/firmware.bin "$WORK/$VERSION/firmware.bin"

          cat > "$WORK/README.md" <<EOF
          # Ветка firmware

          Служебная ветка: здесь лежит прошивка последнего релиза для ESP32 DEVKIT1,
          которую скачивает кнопка «Скачать и установить» в веб-интерфейсе устройства.

          Ветку целиком пересоздаёт workflow \`.github/workflows/build.yml\` на каждом
          теге \`v*\`. Руками сюда коммитить нечего — исходники живут в \`main\`.

          Текущая версия: \`$VERSION\` — [\`$VERSION/firmware.bin\`]($VERSION/firmware.bin)
          EOF

          cd "$WORK"
          git init -q -b firmware
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Firmware $VERSION for the web updater"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" firmware

          echo "### Прошивка $VERSION опубликована в ветку firmware" >> "$GITHUB_STEP_SUMMARY"
